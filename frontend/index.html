<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NanoNet: mikroservislerinizi gerçek zamanlı izleyin, agent tabanlı komut yürütün ve AI destekli anomali analiziyle aksiyon alın."
    />
    <title>NanoNet — Mikroservis İzleme Platformu</title>
    <script>
      (() => {
        var theme = localStorage.getItem("nanonet-theme");
        if (theme === "dark") document.documentElement.classList.add("dark");
        
        var lang = localStorage.getItem("i18nextLng") || navigator.language.split('-')[0] || 'en';
        document.documentElement.setAttribute("lang", lang);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
