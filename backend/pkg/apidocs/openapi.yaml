openapi: 3.1.0
info:
  title: NanoNet API
  description: |
    NanoNet — Mikroservis İzleme ve Yönetim Platformu REST API dokümantasyonu.

    **Kimlik Doğrulama:** Korumalı endpoint'ler JWT Bearer token gerektirir.
    Access token `Authorization: Bearer <access_token>` header'ı ile iletilir.
    Token süresi 15 dakikadır; `/api/v1/auth/refresh` ile yenilenebilir.

    **Base URL:** `http://localhost:8080`

    **Versiyon:** v1
  version: "1.0.0"
  contact:
    name: Kael Valen
servers:
  - url: http://localhost:8080
    description: Yerel geliştirme ortamı
  - url: https://api.nanonet.example.com
    description: Production ortamı

tags:
  - name: Auth
    description: Kimlik doğrulama ve kullanıcı yönetimi
  - name: Services
    description: İzlenen servis yönetimi (CRUD)
  - name: Metrics
    description: Zaman serisi metrik sorgulama
  - name: Alerts
    description: Uyarı yönetimi
  - name: AI
    description: Claude API destekli anomali analizi
  - name: Commands
    description: Servis komut geçmişi
  - name: Settings
    description: Kullanıcı ayarları
  - name: Audit
    description: Güvenlik ve işlem günlüğü
  - name: System
    description: Sağlık ve sistem endpoint'leri
  - name: Dependencies
    description: Servis bağımlılık grafiği
  - name: Grants
    description: Servis paylaşım yetkileri
  - name: Maintenance
    description: Bakım pencereleri
  - name: Logs
    description: Merkezi log arama
  - name: Security
    description: Güvenlik taramaları
  - name: Demo
    description: Demo veri
  - name: Agents
    description: Agent sürüm yönetimi
  - name: ApiTokens
    description: Kişisel API token'ları
  - name: Incidents
    description: Incident yönetimi
  - name: StatusPages
    description: Durum sayfaları
  - name: SLO
    description: Service level objectives
  - name: Probes
    description: Synthetic HTTP probeler
  - name: Runbooks
    description: Alert otomasyonu
  - name: Notifications
    description: Çok kanallı bildirimler
  - name: Kubernetes
    description: kubectl tabanlı K8s API
  - name: Billing
    description: Abonelik ve faturalama

components:
  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---- AUTH ----
    RegisterRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: MySecurePass123

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: 15 dakika geçerli JWT
        refresh_token:
          type: string
          description: 7 gün geçerli refresh token

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    # ---- SERVICE ----
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: payment-service
        host:
          type: string
          example: 192.168.1.100
        port:
          type: integer
          example: 8080
        health_endpoint:
          type: string
          example: /health
        poll_interval_sec:
          type: integer
          example: 10
        status:
          type: string
          enum: [ healthy, unhealthy, degraded, unknown ]
        agent_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateServiceRequest:
      type: object
      required: [ name, host, port, health_endpoint, poll_interval_sec ]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: auth-service
        host:
          type: string
          example: 10.0.0.5
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 3000
        health_endpoint:
          type: string
          example: /health
        poll_interval_sec:
          type: integer
          minimum: 5
          maximum: 300
          example: 10

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        health_endpoint:
          type: string
        poll_interval_sec:
          type: integer

    # ---- METRICS ----
    MetricSnapshot:
      type: object
      properties:
        time:
          type: string
          format: date-time
        cpu_percent:
          type: number
          format: float
          example: 42.5
        memory_used_mb:
          type: number
          format: float
          example: 512.3
        latency_ms:
          type: number
          format: float
          example: 87.2
        error_rate:
          type: number
          format: float
          example: 0.5
        disk_used_gb:
          type: number
          format: float
          example: 15.7
        status:
          type: string

    AggregatedMetrics:
      type: object
      properties:
        avg_cpu:
          type: number
        max_cpu:
          type: number
        avg_memory:
          type: number
        avg_latency:
          type: number
        p95_latency:
          type: number
        error_rate:
          type: number
        sample_count:
          type: integer

    UptimeResponse:
      type: object
      properties:
        uptime_percent:
          type: number
          example: 99.5
        total_checks:
          type: integer
        healthy_checks:
          type: integer
        window_hours:
          type: integer

    # ---- ALERT ----
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        type:
          type: string
          example: cpu_threshold
        severity:
          type: string
          enum: [ info, warn, crit ]
        message:
          type: string
        triggered_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true

    # ---- AI ----
    AnalyzeRequest:
      type: object
      properties:
        window_minutes:
          type: integer
          default: 30
          minimum: 5
          maximum: 1440
          description: Analiz edilecek geçmiş zaman penceresi (dakika)
        deep_analysis:
          type: boolean
          default: false
          description: true ise claude-sonnet-3, false ise claude-haiku-3 kullanılır

    AnalysisResult:
      type: object
      properties:
        summary:
          type: string
          description: Servis durumunun kısa özeti
        root_cause:
          type: string
          description: Tespit edilen sorunun kök nedeni
        risk_level:
          type: string
          enum: [ low, medium, high, critical ]
        recommendations:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              priority:
                type: string
                enum: [ low, medium, high ]
        anomalies:
          type: array
          items:
            type: string

    AIInsight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alert_id:
          type: string
          format: uuid
        model:
          type: string
        summary:
          type: string
        root_cause:
          type: string
          nullable: true
        recommendations:
          type: object
        created_at:
          type: string
          format: date-time

    # ---- SETTINGS ----
    UserSettings:
      type: object
      properties:
        cpu_threshold:
          type: number
          default: 80.0
        memory_threshold:
          type: number
          default: 85.0
        latency_threshold:
          type: number
          default: 1000.0
        error_rate_threshold:
          type: number
          default: 5.0
        email_notifications:
          type: boolean
          default: false

    # ---- GENERIC ----
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: geçersiz istek

    PaginatedResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
        total:
          type: integer
        page:
          type: integer
    Plan:
      type: object
      properties:
        id:
          type: string
          example: pro
        name:
          type: string
          example: Pro
        tier:
          type: integer
          example: 2
        price_monthly_usd:
          type: number
          example: 29
        max_services:
          type: integer
          example: 50
        max_agents:
          type: integer
          example: 50
        max_probes:
          type: integer
          example: 100
        max_alert_rules:
          type: integer
          example: 500
        ai_tokens_monthly:
          type: integer
          example: 2000000
        metric_retention_days:
          type: integer
          example: 90
        log_retention_days:
          type: integer
          example: 30
        k8s_enabled:
          type: boolean
          example: true
        slo_enabled:
          type: boolean
          example: true
        runbooks_enabled:
          type: boolean
          example: true
        team_members:
          type: integer
          example: 5
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan_id:
          type: string
          example: pro
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum:
            - active
            - canceled
            - past_due
            - trialing
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanSummary:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        usage:
          type: object
          properties:
            services_used:
              type: integer
            agents_used:
              type: integer
            probes_used:
              type: integer
            alert_rules_used:
              type: integer
            ai_tokens_used:
              type: integer

security: []

paths:

  # ============================================================
  # AUTH
  # ============================================================
  /api/v1/auth/register:
    post:
      tags: [ Auth ]
      summary: Yeni kullanıcı kaydı
      description: >-
        E-posta ve parola ile yeni hesap oluşturur.

        Başarılıysa kullanıcı bilgisi ve JWT token çifti döner.

        Aynı e-posta ile ikinci kayıt HTTP 409 döndürür.



        **🖥️ Front-end kullanımı:** `authApi.register()` — **RegisterPage** kayıt formu (useAuth). Access token Zustand store'a yazılır, refresh token HttpOnly cookie ile döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: "kael@example.com"
              password: "Secure1234"
      responses:
        '201':
          description: Kayıt başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validasyon hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-posta zaten kayıtlı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [ Auth ]
      summary: Kullanıcı girişi
      description: >-
        E-posta ve parola ile giriş yapar.

        Başarılıysa access_token (15dk) ve refresh_token (7gün) döner.

        Rate limit: 10 istek/dakika.



        **🖥️ Front-end kullanımı:** `authApi.login()` — **LoginPage** giriş formu (useAuth). Başarıda kullanıcı + access token store'a yazılır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Geçersiz kimlik bilgileri
        '429':
          description: Rate limit aşıldı

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      summary: Çıkış yap
      description: >-
        Mevcut access token'ı blacklist'e ekler.

        Sonraki isteklerde bu token geçersiz sayılır.



        **🖥️ Front-end kullanımı:** `authApi.logout()` — üst menüdeki "Çıkış Yap". Refresh cookie temizlenir, store sıfırlanır.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Çıkış başarılı
        '401':
          description: Kimlik doğrulama gerekli

  /api/v1/auth/refresh:
    post:
      tags: [ Auth ]
      summary: Access token yenile
      description: >-
        Refresh token ile yeni access token üretir.


        **🖥️ Front-end kullanımı:** `authApi.refresh()` — `client.ts` axios interceptor'ı 401 alınca otomatik çağırır; access token sessizce yenilenir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refresh_token ]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token yenilendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '401':
          description: Geçersiz veya süresi dolmuş refresh token

  /api/v1/auth/me:
    get:
      tags: [ Auth ]
      summary: Mevcut kullanıcı bilgisi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Kullanıcı bilgisi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Token gerekli
      description: "**🖥️ Front-end kullanımı:** `authApi.me()` — uygulama açılışında
        oturumu doğrulamak için (useAuth bootstrap)."

  /api/v1/auth/password:
    put:
      tags: [ Auth ]
      summary: Parola değiştir
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ current_password, new_password ]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Parola güncellendi
        '400':
          description: Mevcut parola hatalı
      description: "**🖥️ Front-end kullanımı:** `settingsApi.changePassword()` —
        **SettingsPage › Güvenlik** parola değiştirme."

  /api/v1/auth/forgot-password:
    post:
      tags: [ Auth ]
      summary: Şifre sıfırlama e-postası gönder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: E-posta gönderildi (e-posta kayıtlı olmasa bile 200 döner; güvenlik)
      description: "**🖥️ Front-end kullanımı:** `authApi.forgotPassword()` —
        **ForgotPasswordPage** sıfırlama e-postası talebi."

  /api/v1/auth/reset-password:
    post:
      tags: [ Auth ]
      summary: Parola sıfırla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, new_password ]
              properties:
                token:
                  type: string
                  description: E-posta ile gönderilen sıfırlama token'ı
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Parola sıfırlandı
        '400':
          description: Token geçersiz veya süresi dolmuş
      description: "**🖥️ Front-end kullanımı:** `authApi.resetPassword()` —
        **ResetPasswordPage** (e-postadaki token ile yeni parola)."

  /api/v1/auth/agent-token:
    post:
      tags: [ Auth ]
      summary: Agent kimlik token'ı oluştur
      description: >-
        İzlenen sunucuya deploy edilecek Rust agent'ın kullanacağı token üretir.


        **🖥️ Front-end kullanımı:** `authApi.createAgentToken()` — **AgentSetupWizard** / **AgentsPage**, agent kurulumu için tek seferlik token üretir.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Agent token oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          agent_token:
                            type: string

  # ============================================================
  # SERVICES
  # ============================================================
  /api/v1/services:
    get:
      tags: [ Services ]
      summary: Servisleri listele
      description: >-
        Giriş yapmış kullanıcının tüm kayıtlı servislerini döner.


        **🖥️ Front-end kullanımı:** `servicesApi.list()` — **ServicesPage**, **DashboardPage**, **CommandPalette** ve `useServices` hook'u (servis kartları/tablosu).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Servis listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          services:
                            type: array
                            items:
                              $ref: '#/components/schemas/Service'

    post:
      tags: [ Services ]
      summary: Yeni servis ekle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
            example:
              name: "auth-service"
              host: "192.168.1.50"
              port: 8001
              health_endpoint: "/health"
              poll_interval_sec: 10
      responses:
        '201':
          description: Servis oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Service'
        '400':
          description: Validasyon hatası
      description: '**🖥️ Front-end kullanımı:** `servicesApi.create()` — **ServicesPage**
        "Servis Ekle" sihirbazı.'

  "/api/v1/services/{id}":
    get:
      tags: [ Services ]
      summary: Servis detayı
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Servis detayı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Service'
        '404':
          description: Servis bulunamadı
      description: "**🖥️ Front-end kullanımı:** `servicesApi.get()` —
        **ServiceDetailPage** açılışında tekil servis detayı."

    put:
      tags: [ Services ]
      summary: Servis güncelle
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Güncellendi
        '404':
          description: Servis bulunamadı
      description: "**🖥️ Front-end kullanımı:** `servicesApi.update()` —
        **ServiceDetailPage** ayar/düzenleme formu."

    delete:
      tags: [ Services ]
      summary: Servis sil
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Silindi
        '404':
          description: Servis bulunamadı
      description: "**🖥️ Front-end kullanımı:** `servicesApi.delete()` —
        **ServiceDetailPage** / **ServicesPage** silme aksiyonu."

  "/api/v1/services/{id}/ping":
    post:
      tags: [ Services ]
      summary: Servisi manuel ping'le
      description: >-
        Health endpoint'e anlık istek gönderir, latency ve durumu döner.


        **🖥️ Front-end kullanımı:** **ServiceDetailPage** — manuel sağlık kontrolü (anlık ping) butonu.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ping sonucu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          latency_ms:
                            type: number
                          status:
                            type: string

  "/api/v1/services/{id}/restart":
    post:
      tags: [ Services ]
      summary: Servisi yeniden başlat
      description: >-
        Servisin bağlı agent'ına restart komutu gönderir.

        Rate limit: 10 istek/dakika (sıkı limit).



        **🖥️ Front-end kullanımı:** `servicesApi.restart()` — **ServiceDetailPage** aksiyon çubuğu ve **CommandPalette** (agent'a komut kuyruğa alır).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Komut gönderildi
        '429':
          description: Rate limit aşıldı

  "/api/v1/services/{id}/stop":
    post:
      tags: [ Services ]
      summary: Servisi durdur
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Komut gönderildi
      description: '**🖥️ Front-end kullanımı:** `servicesApi.stop()` —
        **ServiceDetailPage** "Durdur" butonu.'

