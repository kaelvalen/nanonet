        **🖥️ Front-end kullanımı:** `billingApi.getPlans()` — **BillingPage** mevcut plan kartları.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Plan listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
  /api/v1/billing/subscription:
    get:
      tags:
        - Billing
      summary: Mevcut abonelik ve kullanım
      description: >-
        Oturum açan kullanıcının aktif aboneliğini ve mevcut kullanım
        sayaçlarını (servis/agent/probe/AI token) döndürür. Yanıt standart zarf
        ile sarılır: `{ "success": true, "data": ... }`.


        **🖥️ Front-end kullanımı:** `billingApi.getSubscription()` — **BillingPage** aktif abonelik + kullanım göstergeleri.
