        - BearerAuth: []
      responses:
        "200":
          description: Abonelik özeti
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PlanSummary"
  /api/v1/billing/subscribe:
    post:
      tags:
        - Billing
      summary: Plan değiştir / yükselt
      description: >-
        Kullanıcıyı verilen plana geçirir. Yanıt standart zarf ile sarılır: `{
        "success": true, "data": ... }`.


        **🖥️ Front-end kullanımı:** `billingApi.subscribe()` — **BillingPage** plan seçme/yükseltme.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan_id
              properties:
                plan_id:
                  type: string
                  example: pro
      responses:
        "200":
          description: Güncel abonelik
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Subscription"
