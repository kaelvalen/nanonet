# Bu dosya openapi.yaml paths bölümüne birleştirilir (make openapi-sync).
# Sadece path tanımları — tags/components ana dosyada.

  /health:
    get:
      tags: [System]
      summary: Basit sağlık kontrolü
      responses:
        '200':
          description: OK

